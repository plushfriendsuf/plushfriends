backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "shop"
    label: "Butik"
    files:
      - name: "products"
        label: "Produkter"
        file: "content/products.json"
        fields:
          - label: "Produkter"
            name: "products"
            widget: "list"
            summary: "{{fields.title}} – {{fields.price}} kr ({{fields.stock}} i lager)"
            fields:
              - { label: "ID (unikt, t.ex. svart-katt)", name: "id", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beskrivning", name: "description", widget: "text", required: false }
              - { label: "Pris (kr)", name: "price", widget: "number", value_type: "int", min: 0 }
              - { label: "Lagersaldo", name: "stock", widget: "number", value_type: "int", min: 0, default: 1 }
              - label: "Kategori"
                name: "category"
                widget: "select"
                default: "classic"
                options:
                  - { label: "Halloween", value: "halloween" }
                  - { label: "Klassiker", value: "classic" }
              - { label: "Bild", name: "image", widget: "image", required: false }
              - { label: "Kommer snart", name: "coming_soon", widget: "boolean", default: false }
