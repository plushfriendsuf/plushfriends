-- 1. Skapa tabellen för produkter
CREATE TABLE IF NOT EXISTS public.products (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    name TEXT NOT NULL,
    price NUMERIC NOT NULL DEFAULT 0,
    category TEXT DEFAULT 'classic',
    "desc" TEXT DEFAULT '',
    icon TEXT DEFAULT '',
    bg TEXT DEFAULT 'from-pink-100 to-rose-100',
    image_url TEXT DEFAULT '',
    coming_soon BOOLEAN DEFAULT false,
    active BOOLEAN DEFAULT true,
    created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 2. Aktivera säkerhet (Row Level Security)
ALTER TABLE public.products ENABLE ROW LEVEL SECURITY;

-- 3. Ta bort gamla policys om de redan finns
DROP POLICY IF EXISTS "Alla kan visa aktiva produkter" ON public.products;
DROP POLICY IF EXISTS "Administratörer kan hantera allt" ON public.products;

-- 4. Skapa RLS-policys för tabellen
CREATE POLICY "Alla kan visa aktiva produkter"
ON public.products
FOR SELECT
USING (active = true);

CREATE POLICY "Administratörer kan hantera allt"
ON public.products
FOR ALL
TO authenticated
USING (true)
WITH CHECK (true);

-- 5. Skapa lagringsplats (Storage Bucket) för produktbilder
INSERT INTO storage.buckets (id, name, public)
VALUES ('product-images', 'product-images', true)
ON CONFLICT (id) DO NOTHING;

-- 6. Ta bort gamla policys för lagringshinken om de finns
DROP POLICY IF EXISTS "Offentliga bilder kan visas av alla" ON storage.objects;
DROP POLICY IF EXISTS "Administratörer kan ladda upp bilder" ON storage.objects;

-- 7. Skapa policys för bildlagringen
CREATE POLICY "Offentliga bilder kan visas av alla"
ON storage.objects
FOR SELECT
USING (bucket_id = 'product-images');

CREATE POLICY "Administratörer kan ladda upp bilder"
ON storage.objects
FOR INSERT
TO authenticated
WITH CHECK (bucket_id = 'product-images');

